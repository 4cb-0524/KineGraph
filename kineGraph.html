<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>KineGraph — Mobile Motion Editor</title>
  <style>
    :root{--bg:#15161a;--panel:#202124;--line:#35363b;--text:#f4f4f5;--muted:#9a9ca3;--purple:#b89cff;--cyan:#63c8eb;--yellow:#dfbd66;--timeline-height:222px}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--text);font:12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}button,input{font:inherit}button{border:0;color:var(--text);background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{height:100dvh;display:grid;grid-template-rows:52px 1fr var(--timeline-height)}
    .topbar{display:grid;grid-template-columns:92px 1fr 92px;align-items:center;padding:0 10px;background:#1c1d20;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;font-weight:700}.brand-mark{width:22px;height:22px;border:2px solid var(--purple);border-radius:6px;transform:rotate(45deg)}.transport{display:flex;justify-content:center;align-items:center;gap:5px}.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px}.icon-btn:active,.icon-btn.active{background:#34353a}.play{width:42px;height:42px;border-radius:50%;background:#303136}.timecode{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
    .workspace{min-height:0;display:grid;grid-template-columns:58px 1fr 54px}.tools{background:#1d1e21;border-right:1px solid var(--line);padding:8px 7px;display:flex;flex-direction:column;gap:4px}.tool{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;color:#bfc0c5}.tool.active{color:white;background:#34353a}.tool svg,.prop svg{width:20px;height:20px}svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .stage-wrap{position:relative;display:grid;place-items:center;background:#111216;overflow:hidden}.stage-wrap:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#1a1b1f 1px,transparent 1px),linear-gradient(90deg,#1a1b1f 1px,transparent 1px);background-size:24px 24px;opacity:.55}.stage{position:relative;width:min(82%,370px);aspect-ratio:16/9;background:linear-gradient(145deg,#3e434d 0%,#22262d 58%,#17191d 100%);box-shadow:0 12px 30px #0007;overflow:hidden;touch-action:none;perspective:800px}.stage:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 68% 35%,#b89cff3d,transparent 25%),linear-gradient(120deg,transparent 55%,#63c8eb1f);pointer-events:none;z-index:4}.stage.is-3d{background:linear-gradient(145deg,#343a47,#1b2029 75%)}.stage.is-3d:before{content:"";position:absolute;inset:-40%;z-index:0;background-image:linear-gradient(#63c8eb25 1px,transparent 1px),linear-gradient(90deg,#63c8eb25 1px,transparent 1px);background-size:24px 24px;transform:rotateX(63deg) scale(1.3);transform-origin:center 65%}.view-badge{position:absolute;z-index:6;left:8px;top:7px;color:#c5c6cb;background:#1119;border:1px solid #ffffff20;border-radius:5px;padding:4px 6px;font-size:9px;letter-spacing:.08em}.art{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;border:2px solid #ffffff26;border-radius:18%;background:linear-gradient(135deg,#d2c2ff,#8063d9);box-shadow:0 18px 28px #0005;z-index:2;touch-action:none}.art:before{content:"";position:absolute;inset:18%;border:2px solid #ffffffb3;border-radius:50%;box-shadow:0 0 18px #ffffff40}.art.selected:after{content:"";position:absolute;inset:-8px;border:1.5px solid var(--purple);border-radius:12%}.handle{position:absolute;width:8px;height:8px;background:white;border:1.5px solid var(--purple);border-radius:50%}.handle.tl{left:-12px;top:-12px}.handle.tr{right:-12px;top:-12px}.handle.bl{left:-12px;bottom:-12px}.handle.br{right:-12px;bottom:-12px}.null-controller{display:none;position:absolute;left:50%;top:50%;width:45%;height:45%;border:1px dashed var(--cyan);transform:translate(-50%,-50%);z-index:3;pointer-events:none}.null-controller.visible{display:block}.null-controller:before,.null-controller:after{content:"";position:absolute;background:var(--cyan);opacity:.8}.null-controller:before{width:18px;height:1px;left:50%;top:50%}.null-controller:after{height:18px;width:1px;left:50%;top:50%}.null-label{position:absolute;top:-16px;left:0;color:var(--cyan);font-size:9px}
    .properties{background:#1d1e21;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:5px}.prop{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;color:#aeb0b6}.prop.active{background:#34353a;color:white}
    .timeline{min-height:0;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-rows:40px 1fr}.timeline-head{display:grid;grid-template-columns:108px 1fr;border-bottom:1px solid var(--line)}.timeline-actions{display:flex;align-items:center;gap:2px;padding-left:7px}.zoom{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:10px}.zoom input{width:84px;accent-color:var(--purple)}.timeline-body{min-height:0;display:grid;grid-template-columns:108px 1fr}.layers{border-right:1px solid var(--line);background:#1e1f22;overflow-y:auto}.track-label{height:44px;display:flex;align-items:center;gap:7px;padding:0 8px;border-bottom:1px solid #303136}.track-label.selected{background:#2c2d32}.eye{width:18px;color:var(--muted)}.layer-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tracks{position:relative;overflow:hidden;background:#242529}.ruler{height:24px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line);color:#777982;font-size:9px}.tick{flex:1;height:100%;border-left:1px solid #35363a;padding:3px 0 0 4px}.track-area{position:relative}.lane{height:44px;border-bottom:1px solid #303136;position:relative}.clip{position:absolute;left:14%;right:18%;top:7px;height:30px;border-radius:5px;background:#7b65b5;border:1px solid #9a81da;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:10px;box-shadow:inset 0 1px #ffffff20}.clip.null-clip{background:#286d80;border-color:#50a7bd}.clip-dot{width:7px;height:7px;border:1.5px solid white;border-radius:50%;background:var(--yellow);position:absolute}.dot1{left:20%;top:11px}.dot2{left:56%;top:11px}.dot3{left:72%;top:11px}.playhead{position:absolute;z-index:5;left:38%;top:0;bottom:0;width:1.5px;background:#efc66f;pointer-events:none}.playhead:before{content:"";position:absolute;width:11px;height:7px;left:-5px;top:0;background:#efc66f;clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%)}.scrubber{position:absolute;inset:0;z-index:4;touch-action:pan-y}
    .panel-drawer{position:absolute;right:54px;top:52px;bottom:var(--timeline-height);width:190px;background:#202124f7;border:1px solid var(--line);border-radius:10px;transform:translateX(214px);transition:transform .18s ease;z-index:20;padding:10px;overflow:auto}.panel-drawer.open{transform:translateX(0)}.panel-title{color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:.12em;margin-bottom:10px}.control-row{display:grid;grid-template-columns:62px 1fr;align-items:center;margin:8px 0}.control-row input{width:100%;accent-color:var(--purple)}.section-label{font-size:9px;color:#777982;margin:12px 0 5px;border-top:1px solid var(--line);padding-top:8px}
    @media(max-width:700px){:root{--timeline-height:205px}.app{grid-template-rows:48px 1fr var(--timeline-height)}.topbar{grid-template-columns:70px 1fr 70px;padding:0 6px}.brand span{display:none}.workspace{grid-template-columns:48px 1fr 46px}.tools{padding:7px 4px}.tool{width:40px;height:40px}.properties{padding-top:7px}.prop{width:38px;height:38px}.stage{width:min(88%,320px)}.timeline-head,.timeline-body{grid-template-columns:88px 1fr}.panel-drawer{right:46px;width:175px}}
    @media(orientation:landscape) and (max-height:520px){:root{--timeline-height:150px}.app{grid-template-rows:44px 1fr var(--timeline-height)}.stage{width:min(58%,330px)}.track-label,.lane{height:36px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="brand-mark"></div><span>KineGraph</span></div><div class="transport"><button class="icon-btn" id="toStart" aria-label="先頭へ">⏮</button><button class="icon-btn play" id="play" aria-label="再生">▶</button><button class="icon-btn" id="toEnd" aria-label="最後へ">⏭</button></div><div class="timecode" id="timecode">00:02:14</div></header>
    <section class="workspace">
      <nav class="tools" aria-label="ツール">
        <button class="tool active" data-tool="select" title="選択"><svg viewBox="0 0 24 24"><path d="M5 3l13 9-7 1-3 7z"/></svg></button>
        <button class="tool" data-tool="hand" title="移動"><svg viewBox="0 0 24 24"><path d="M7 11V7a2 2 0 014 0v3-5a2 2 0 014 0v5-3a2 2 0 014 0v6c0 4-3 7-7 7h-1c-3 0-5-2-6-4l-2-4a2 2 0 013-2z"/></svg></button>
        <button class="tool" data-tool="text" title="テキスト"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8 19h8"/></svg></button>
        <button class="tool" data-tool="shape" title="図形"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg></button>
        <button class="tool" id="toggle3d" title="3D空間"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg></button>
      </nav>
      <div class="stage-wrap"><div class="stage" id="stage"><div class="view-badge" id="viewBadge">2D VIEW</div><div class="null-controller" id="nullController"><span class="null-label">NULL 01</span></div><div class="art selected" id="art"><i class="handle tl"></i><i class="handle tr"></i><i class="handle bl"></i><i class="handle br"></i></div></div></div>
      <aside class="properties"><button class="prop active" data-panel="transform" title="変形"><svg viewBox="0 0 24 24"><path d="M4 4h6M4 4v6M20 20h-6M20 20v-6M7 17l10-10"/></svg></button><button class="prop" data-panel="opacity" title="不透明度"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 010 14z"/></svg></button><button class="prop" data-panel="effects" title="エフェクト"><svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM19 16l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg></button></aside>
      <div class="panel-drawer open" id="drawer"><div class="panel-title" id="panelTitle">Transform · 2D</div><div class="control-row"><span>位置 X</span><input id="posX" type="range" min="-120" max="120" value="0"></div><div class="control-row"><span>位置 Y</span><input id="posY" type="range" min="-120" max="120" value="0"></div><div class="control-row"><span>スケール</span><input id="scale" type="range" min="50" max="180" value="100"></div><div class="control-row"><span>回転 Z</span><input id="rotate" type="range" min="-180" max="180" value="0"></div><div class="section-label">3D TRANSFORM</div><div class="control-row"><span>位置 Z</span><input id="posZ" type="range" min="-250" max="250" value="0"></div><div class="control-row"><span>回転 X</span><input id="rotateX" type="range" min="-180" max="180" value="0"></div><div class="control-row"><span>回転 Y</span><input id="rotateY" type="range" min="-180" max="180" value="0"></div></div>
    </section>
    <section class="timeline"><div class="timeline-head"><div class="timeline-actions"><button class="icon-btn" id="addLayer" title="シェイプレイヤー追加">＋</button><button class="icon-btn" id="addNull" title="ヌルオブジェクト追加">◇</button><button class="icon-btn" id="deleteLayer" title="選択レイヤー削除">⌫</button></div><div class="zoom"><span>−</span><input type="range" min="50" max="150" value="100"><span>＋</span></div></div><div class="timeline-body"><div class="layers" id="layers"><div class="track-label selected" data-layer="art"><span class="eye">◉</span><span class="layer-name">紫の円形</span><span>⌄</span></div><div class="track-label"><span class="eye">◉</span><span class="layer-name">背景</span><span>⌄</span></div><div class="track-label"><span class="eye">◉</span><span class="layer-name">調整レイヤー</span><span>⌄</span></div></div><div class="tracks" id="tracks"><div class="ruler"><div class="tick">0:00</div><div class="tick">0:02</div><div class="tick">0:04</div><div class="tick">0:06</div><div class="tick">0:08</div></div><div class="track-area" id="trackArea"><div class="lane"><div class="clip">Shape 01 <i class="clip-dot dot1"></i><i class="clip-dot dot2"></i><i class="clip-dot dot3"></i></div></div><div class="lane"></div><div class="lane"></div></div><div class="playhead" id="playhead"></div><div class="scrubber" id="scrubber"></div></div></div></section>
  </main>
  <script>
    const art=document.getElementById('art'),stage=document.getElementById('stage'),drawer=document.getElementById('drawer'),playhead=document.getElementById('playhead'),scrubber=document.getElementById('scrubber');
    const artState={x:0,y:0,z:0,scale:100,rz:0,rx:0,ry:0};
    const nullState={x:0,y:0,z:0,rz:0,rx:0,ry:0};
    let is3d=false,hasNull=false,selected='art',playing=false,progress=38,timer=null;
    function activeTransform(){return selected==='null'&&hasNull?nullState:artState}
    function renderArt(){const x=artState.x+(hasNull?nullState.x:0),y=artState.y+(hasNull?nullState.y:0),z=artState.z+(hasNull?nullState.z:0);art.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${z}px) scale(${artState.scale/100}) rotateX(${artState.rx+(hasNull?nullState.rx:0)}deg) rotateY(${artState.ry+(hasNull?nullState.ry:0)}deg) rotateZ(${artState.rz+(hasNull?nullState.rz:0)}deg)`;document.getElementById('nullController').style.transform=`translate(calc(-50% + ${nullState.x}px),calc(-50% + ${nullState.y}px)) translateZ(${nullState.z}px) rotate(${nullState.rz}deg)`}
    function syncControls(){const s=activeTransform();for(const [id,key] of [['posX','x'],['posY','y'],['posZ','z'],['scale','scale'],['rotate','rz'],['rotateX','rx'],['rotateY','ry']]){const el=document.getElementById(id);el.value=s[key]??0;el.disabled=selected==='null'&&key==='scale'}document.getElementById('panelTitle').textContent=(selected==='null'?'Null Object':'Transform')+' · '+(is3d?'3D':'2D')}
    for(const [id,key] of [['posX','x'],['posY','y'],['posZ','z'],['scale','scale'],['rotate','rz'],['rotateX','rx'],['rotateY','ry']])document.getElementById(id).addEventListener('input',e=>{activeTransform()[key]=Number(e.target.value);renderArt()});
    document.querySelectorAll('.tool[data-tool]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tool[data-tool]').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}));
    document.getElementById('toggle3d').addEventListener('click',e=>{is3d=!is3d;stage.classList.toggle('is-3d',is3d);e.currentTarget.classList.toggle('active',is3d);document.getElementById('viewBadge').textContent=is3d?'3D PERSPECTIVE':'2D VIEW';syncControls()});
    document.querySelectorAll('.prop').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.prop').forEach(b=>b.classList.remove('active'));btn.classList.add('active');drawer.classList.add('open');document.getElementById('panelTitle').textContent=btn.dataset.panel==='transform'?(selected==='null'?'Null Object':'Transform')+' · '+(is3d?'3D':'2D'):btn.dataset.panel==='opacity'?'Opacity':'Effects'}));
    let drag=null;art.addEventListener('pointerdown',e=>{if(selected==='null')return;art.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,sx:artState.x,sy:artState.y}});art.addEventListener('pointermove',e=>{if(!drag)return;artState.x=Math.round(drag.sx+e.clientX-drag.x);artState.y=Math.round(drag.sy+e.clientY-drag.y);document.getElementById('posX').value=artState.x;document.getElementById('posY').value=artState.y;renderArt()});art.addEventListener('pointerup',()=>drag=null);
    function selectLayer(kind,row){selected=kind;document.querySelectorAll('.track-label').forEach(r=>r.classList.remove('selected'));row.classList.add('selected');art.classList.toggle('selected',kind==='art');document.getElementById('nullController').classList.toggle('visible',kind==='null'&&hasNull);syncControls()}
    document.getElementById('layers').addEventListener('click',e=>{const row=e.target.closest('.track-label');if(row)selectLayer(row.dataset.layer||'art',row)});
    document.getElementById('addNull').addEventListener('click',()=>{if(hasNull){const row=document.querySelector('[data-layer="null"]');selectLayer('null',row);return}hasNull=true;const row=document.createElement('div');row.className='track-label';row.dataset.layer='null';row.innerHTML='<span class="eye">◇</span><span class="layer-name">ヌル 01</span><span>⌄</span>';document.getElementById('layers').prepend(row);const lane=document.createElement('div');lane.className='lane';lane.innerHTML='<div class="clip null-clip">Null 01 · 親</div>';document.getElementById('trackArea').prepend(lane);document.getElementById('nullController').classList.add('visible');selectLayer('null',row);renderArt()});
    document.getElementById('addLayer').addEventListener('click',()=>{const clone=document.createElement('div');clone.className='art';clone.style.width='18%';clone.style.left='70%';clone.style.top='28%';clone.style.background='linear-gradient(135deg,#79d7ef,#3979a6)';stage.appendChild(clone);const row=document.createElement('div');row.className='track-label';row.innerHTML='<span class="eye">◉</span><span class="layer-name">シェイプ 02</span><span>⌄</span>';document.getElementById('layers').appendChild(row);const lane=document.createElement('div');lane.className='lane';lane.innerHTML='<div class="clip">Shape 02</div>';document.getElementById('trackArea').appendChild(lane)});
    document.getElementById('deleteLayer').addEventListener('click',()=>{if(selected==='null'&&hasNull){hasNull=false;document.querySelector('[data-layer="null"]')?.remove();document.getElementById('trackArea').querySelector('.null-clip')?.parentElement.remove();document.getElementById('nullController').classList.remove('visible');selected='art';document.querySelector('[data-layer="art"]').classList.add('selected');syncControls()}});
    function setProgress(p){progress=Math.max(0,Math.min(100,p));playhead.style.left=progress+'%';const frame=Math.round(progress*8/100);document.getElementById('timecode').textContent=`00:0${frame}:${String(Math.round((progress%12.5)*8)).padStart(2,'0')}`}
    scrubber.addEventListener('pointerdown',e=>{const r=scrubber.getBoundingClientRect();setProgress((e.clientX-r.left)/r.width*100)});
    document.getElementById('play').addEventListener('click',e=>{playing=!playing;e.currentTarget.textContent=playing?'Ⅱ':'▶';if(playing)timer=setInterval(()=>{setProgress(progress+.35);if(progress>=100)setProgress(0)},30);else clearInterval(timer)});document.getElementById('toStart').addEventListener('click',()=>setProgress(0));document.getElementById('toEnd').addEventListener('click',()=>setProgress(100));setProgress(progress);syncControls();
  </script>
</body>
</html>
