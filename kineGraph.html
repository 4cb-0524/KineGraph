<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>KineGraph — Mobile Motion Editor</title>
  <style>
    :root {
      --bg: #15161a;
      --panel: #202124;
      --panel2: #292a2e;
      --line: #35363b;
      --text: #f4f4f5;
      --muted: #9a9ca3;
      --purple: #b89cff;
      --cyan: #63c8eb;
      --yellow: #dfbd66;
      --green: #74c69d;
      --timeline-height: 222px;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button, input { font: inherit; }
    button {
      border: 0;
      color: var(--text);
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app { height: 100dvh; display: grid; grid-template-rows: 52px 1fr var(--timeline-height); }

    .topbar {
      display: grid;
      grid-template-columns: 92px 1fr 92px;
      align-items: center;
      padding: 0 10px;
      background: #1c1d20;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .brand-mark { width: 22px; height: 22px; border: 2px solid var(--purple); border-radius: 6px; transform: rotate(45deg); }
    .transport { display: flex; justify-content: center; align-items: center; gap: 5px; }
    .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; }
    .icon-btn:active, .icon-btn.active { background: #34353a; }
    .play { width: 42px; height: 42px; border-radius: 50%; background: #303136; }
    .timecode { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

    .workspace { min-height: 0; display: grid; grid-template-columns: 58px 1fr 54px; }
    .tools { background: #1d1e21; border-right: 1px solid var(--line); padding: 8px 7px; display: flex; flex-direction: column; gap: 4px; }
    .tool { width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center; color: #bfc0c5; }
    .tool.active { color: white; background: #34353a; }
    .tool svg { width: 20px; height: 20px; }

    .stage-wrap { position: relative; display: grid; place-items: center; background: #111216; overflow: hidden; }
    .stage-wrap::before {
      content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(#1a1b1f 1px, transparent 1px), linear-gradient(90deg,#1a1b1f 1px,transparent 1px);
      background-size: 24px 24px; opacity: .55;
    }
    .stage {
      position: relative;
      width: min(82%, 370px);
      aspect-ratio: 16 / 9;
      background: linear-gradient(145deg, #3e434d 0%, #22262d 58%, #17191d 100%);
      box-shadow: 0 12px 30px rgba(0,0,0,.45);
      overflow: hidden;
      touch-action: none;
    }
    .stage::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 68% 35%, rgba(184,156,255,.24), transparent 25%), linear-gradient(120deg, transparent 55%, rgba(99,200,235,.12));
      pointer-events: none;
    }

    .art {
      position: absolute;
      left: 50%; top: 50%;
      width: 34%; aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(1);
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 18%;
      background: linear-gradient(135deg, #d2c2ff, #8063d9);
      box-shadow: 0 18px 28px rgba(0,0,0,.28);
      z-index: 2;
    }
    .art::before {
      content: ""; position: absolute; inset: 18%; border: 2px solid rgba(255,255,255,.7); border-radius: 50%;
      box-shadow: 0 0 18px rgba(255,255,255,.25);
    }
    .art.selected::after {
      content: ""; position: absolute; inset: -8px; border: 1.5px solid var(--purple); border-radius: 12%;
    }
    .handle { position: absolute; width: 8px; height: 8px; background: white; border: 1.5px solid var(--purple); border-radius: 50%; }
    .handle.tl { left: -12px; top: -12px; } .handle.tr { right: -12px; top: -12px; }
    .handle.bl { left: -12px; bottom: -12px; } .handle.br { right: -12px; bottom: -12px; }

    .properties { background: #1d1e21; border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 5px; }
    .prop { width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center; color: #aeb0b6; }
    .prop.active { background: #34353a; color: white; }

    .timeline { min-height: 0; background: var(--panel); border-top: 1px solid var(--line); display: grid; grid-template-rows: 40px 1fr; }
    .timeline-head { display: grid; grid-template-columns: 108px 1fr; border-bottom: 1px solid var(--line); }
    .timeline-actions { display: flex; align-items: center; gap: 2px; padding-left: 7px; }
    .zoom { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-right: 10px; }
    .zoom input { width: 84px; accent-color: var(--purple); }

    .timeline-body { min-height: 0; display: grid; grid-template-columns: 108px 1fr; }
    .layers { border-right: 1px solid var(--line); background: #1e1f22; }
    .track-label { height: 44px; display: flex; align-items: center; gap: 7px; padding: 0 8px; border-bottom: 1px solid #303136; }
    .track-label.selected { background: #2c2d32; }
    .eye { width: 18px; color: var(--muted); }
    .layer-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    .tracks { position: relative; overflow-x: hidden; background: #242529; }
    .ruler { height: 24px; display: flex; align-items: flex-end; border-bottom: 1px solid var(--line); color: #777982; font-size: 9px; }
    .tick { flex: 1; height: 100%; border-left: 1px solid #35363a; padding: 3px 0 0 4px; }
    .track-area { position: relative; }
    .lane { height: 44px; border-bottom: 1px solid #303136; position: relative; }
    .clip {
      position: absolute; left: 14%; right: 18%; top: 7px; height: 30px;
      border-radius: 5px; background: #7b65b5; border: 1px solid #9a81da;
      display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 10px;
      box-shadow: inset 0 1px rgba(255,255,255,.12);
    }
    .clip-dot { width: 7px; height: 7px; border: 1.5px solid white; border-radius: 50%; background: var(--yellow); position: absolute; }
    .dot1 { left: 20%; top: 11px; } .dot2 { left: 56%; top: 11px; } .dot3 { left: 72%; top: 11px; }

    .playhead { position: absolute; z-index: 5; left: 38%; top: 0; bottom: 0; width: 1.5px; background: #efc66f; pointer-events: none; }
    .playhead::before { content:""; position:absolute; width:11px; height:7px; left:-5px; top:0; background:#efc66f; clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%); }

    .scrubber { position:absolute; inset:0; z-index:4; }

    .panel-drawer {
      position: absolute; right: 54px; top: 52px; bottom: var(--timeline-height); width: 190px;
      background: rgba(32,33,36,.98); border: 1px solid var(--line); border-radius: 10px;
      transform: translateX(214px); transition: transform .18s ease; z-index: 20; padding: 10px;
    }
    .panel-drawer.open { transform: translateX(0); }
    .panel-title { color: var(--muted); text-transform: uppercase; font-size: 9px; letter-spacing: .12em; margin-bottom: 10px; }
    .control-row { display: grid; grid-template-columns: 62px 1fr; align-items: center; margin: 8px 0; }
    .control-row input { width: 100%; accent-color: var(--purple); }

    svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    @media (max-width: 700px) {
      :root { --timeline-height: 205px; }
      .app { grid-template-rows: 48px 1fr var(--timeline-height); }
      .topbar { grid-template-columns: 70px 1fr 70px; padding: 0 6px; }
      .brand span { display: none; }
      .workspace { grid-template-columns: 48px 1fr 46px; }
      .tools { padding: 7px 4px; } .tool { width: 40px; height: 40px; }
      .properties { padding-top: 7px; } .prop { width: 38px; height: 38px; }
      .stage { width: min(88%, 320px); }
      .timeline-head, .timeline-body { grid-template-columns: 88px 1fr; }
      .panel-drawer { right: 46px; width: 175px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      :root { --timeline-height: 150px; }
      .app { grid-template-rows: 44px 1fr var(--timeline-height); }
      .stage { width: min(58%, 330px); }
      .track-label, .lane { height: 36px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"></div><span>KineGraph</span></div>
      <div class="transport">
        <button class="icon-btn" id="toStart" aria-label="先頭へ">⏮</button>
        <button class="icon-btn play" id="play" aria-label="再生">▶</button>
        <button class="icon-btn" id="toEnd" aria-label="最後へ">⏭</button>
      </div>
      <div class="timecode" id="timecode">00:02:14</div>
    </header>

    <section class="workspace">
      <nav class="tools" aria-label="ツール">
        <button class="tool active" data-tool="select" title="選択">
          <svg viewBox="0 0 24 24"><path d="M5 3l13 9-7 1-3 7z"/></svg>
        </button>
        <button class="tool" data-tool="hand" title="移動">
          <svg viewBox="0 0 24 24"><path d="M7 11V7a2 2 0 014 0v3-5a2 2 0 014 0v5-3a2 2 0 014 0v6c0 4-3 7-7 7h-1c-3 0-5-2-6-4l-2-4a2 2 0 013-2z"/></svg>
        </button>
        <button class="tool" data-tool="text" title="テキスト">
          <svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8 19h8"/></svg>
        </button>
        <button class="tool" data-tool="shape" title="図形">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
        </button>
        <button class="tool" data-tool="pen" title="ペン">
          <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16zM13 8l3 3"/></svg>
        </button>
      </nav>

      <div class="stage-wrap">
        <div class="stage" id="stage">
          <div class="art selected" id="art">
            <i class="handle tl"></i><i class="handle tr"></i><i class="handle bl"></i><i class="handle br"></i>
          </div>
        </div>
      </div>

      <aside class="properties">
        <button class="prop active" data-panel="transform" title="変形">
          <svg viewBox="0 0 24 24"><path d="M4 4h6M4 4v6M20 20h-6M20 20v-6M7 17l10-10"/></svg>
        </button>
        <button class="prop" data-panel="opacity" title="不透明度">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 010 14z"/></svg>
        </button>
        <button class="prop" data-panel="effects" title="エフェクト">
          <svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM19 16l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>
        </button>
      </aside>

      <div class="panel-drawer open" id="drawer">
        <div class="panel-title">Transform</div>
        <div class="control-row"><span>位置 X</span><input id="posX" type="range" min="-100" max="100" value="0"></div>
        <div class="control-row"><span>位置 Y</span><input id="posY" type="range" min="-100" max="100" value="0"></div>
        <div class="control-row"><span>スケール</span><input id="scale" type="range" min="50" max="180" value="100"></div>
        <div class="control-row"><span>回転</span><input id="rotate" type="range" min="-180" max="180" value="0"></div>
      </div>
    </section>

    <section class="timeline">
      <div class="timeline-head">
        <div class="timeline-actions">
          <button class="icon-btn" id="addLayer" title="レイヤー追加">＋</button>
          <button class="icon-btn" title="レイヤー削除">⌫</button>
        </div>
        <div class="zoom"><span>−</span><input type="range" min="50" max="150" value="100"><span>＋</span></div>
      </div>
      <div class="timeline-body">
        <div class="layers">
          <div class="track-label selected" id="layerRow">
            <span class="eye">◉</span><span class="layer-name">紫の円形</span><span>⌄</span>
          </div>
          <div class="track-label"><span class="eye">◉</span><span class="layer-name">背景</span><span>⌄</span></div>
          <div class="track-label"><span class="eye">◉</span><span class="layer-name">調整レイヤー</span><span>⌄</span></div>
        </div>
        <div class="tracks" id="tracks">
          <div class="ruler">
            <div class="tick">0:00</div><div class="tick">0:02</div><div class="tick">0:04</div><div class="tick">0:06</div><div class="tick">0:08</div>
          </div>
          <div class="track-area">
            <div class="lane"><div class="clip">Shape 01 <i class="clip-dot dot1"></i><i class="clip-dot dot2"></i><i class="clip-dot dot3"></i></div></div>
            <div class="lane"></div>
            <div class="lane"></div>
          </div>
          <div class="playhead" id="playhead"></div>
          <div class="scrubber" id="scrubber"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const art = document.getElementById('art');
    const stage = document.getElementById('stage');
    const drawer = document.getElementById('drawer');
    const playhead = document.getElementById('playhead');
    const scrubber = document.getElementById('scrubber');
    let state = { x: 0, y: 0, scale: 100, rotate: 0, playing: false, progress: 38 };

    function renderArt() {
      art.style.transform = `translate(calc(-50% + ${state.x}px), calc(-50% + ${state.y}px)) scale(${state.scale / 100}) rotate(${state.rotate}deg)`;
    }

    ['posX','posY','scale','rotate'].forEach(id => {
      document.getElementById(id).addEventListener('input', e => {
        if (id === 'posX') state.x = Number(e.target.value);
        if (id === 'posY') state.y = Number(e.target.value);
        if (id === 'scale') state.scale = Number(e.target.value);
        if (id === 'rotate') state.rotate = Number(e.target.value);
        renderArt();
      });
    });

    document.querySelectorAll('.tool').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.tool').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }));

    document.querySelectorAll('.prop').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.prop').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      drawer.classList.add('open');
      const title = btn.dataset.panel;
      drawer.querySelector('.panel-title').textContent = title === 'transform' ? 'Transform' : title === 'opacity' ? 'Opacity' : 'Effects';
    }));

    let drag = null;
    art.addEventListener('pointerdown', e => {
      art.setPointerCapture(e.pointerId);
      drag = { startX: e.clientX, startY: e.clientY, x: state.x, y: state.y };
    });
    art.addEventListener('pointermove', e => {
      if (!drag) return;
      state.x = Math.round(drag.x + e.clientX - drag.startX);
      state.y = Math.round(drag.y + e.clientY - drag.startY);
      document.getElementById('posX').value = Math.max(-100, Math.min(100, state.x));
      document.getElementById('posY').value = Math.max(-100, Math.min(100, state.y));
      renderArt();
    });
    art.addEventListener('pointerup', () => drag = null);

    function setProgress(p) {
      state.progress = Math.max(0, Math.min(100, p));
      playhead.style.left = state.progress + '%';
      const frame = Math.round(state.progress * 8 / 100);
      document.getElementById('timecode').textContent = `00:0${frame}:${String(Math.round((state.progress % 12.5) * 8)).padStart(2,'0')}`;
    }

    scrubber.addEventListener('pointerdown', e => {
      const rect = scrubber.getBoundingClientRect();
      setProgress((e.clientX - rect.left) / rect.width * 100);
    });

    let timer = null;
    document.getElementById('play').addEventListener('click', e => {
      state.playing = !state.playing;
      e.currentTarget.textContent = state.playing ? 'Ⅱ' : '▶';
      if (state.playing) {
        timer = setInterval(() => { setProgress(state.progress + .35); if (state.progress >= 100) setProgress(0); }, 30);
      } else clearInterval(timer);
    });
    document.getElementById('toStart').addEventListener('click', () => setProgress(0));
    document.getElementById('toEnd').addEventListener('click', () => setProgress(100));

    document.getElementById('addLayer').addEventListener('click', () => {
      const clone = art.cloneNode(true);
      clone.id = '';
      clone.classList.remove('selected');
      clone.style.width = '18%';
      clone.style.left = '70%';
      clone.style.top = '28%';
      clone.style.background = 'linear-gradient(135deg, #79d7ef, #3979a6)';
      stage.appendChild(clone);
    });

    setProgress(state.progress);
  </script>
</body>
</html>
